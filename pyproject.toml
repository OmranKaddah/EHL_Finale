[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackathon-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
description = "Composable document intelligence and asynchronous challenge workflows"
readme = "README.md"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
llm = ["openai>=2.0"]
search = ["httpx>=0.27"]
http = ["httpx>=0.27"]
matching = ["pint>=0.24"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
local = ["docling>=2", "gliner2[local]>=2.0"]
office = ["python-docx>=1.1", "openpyxl>=3.1", "pymupdf>=1.24"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hatchling", "editables", "pip", "httpx>=0.27", "fastapi>=0.115", "pint>=0.24", "openpyxl>=3.1"]

[project.scripts]
hackkit = "hackathon_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
