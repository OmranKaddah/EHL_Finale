[project]
name = "atira-rfq-agent"
version = "0.1.0"
description = "Observable model-directed RFQ investigation and signed bidding"
requires-python = ">=3.12,<3.14"
dependencies = [
  "playwright>=1.51,<2",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "jsonschema>=4.23,<5",
  "pypdfium2>=4.30,<6",
  "pillow>=11,<13",
  "aiohttp>=3.11,<4",
  "simplejson>=3.20,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "hypothesis>=6,<7", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atira_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: launches local Chromium against synthetic websites", "live: requires an explicit live-service opt in"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
