[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackathon-toolkit"
version = "0.1.0"
requires-python = ">=3.11"
description = "Model-directed browser agent for the Atira RFQ-to-bid challenge"
readme = "README.md"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
rfq = ["httpx>=0.27", "playwright>=1.49", "pymupdf>=1.24", "jsonschema>=4.23"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hatchling", "editables", "pip"]

[project.scripts]
rfq-agent = "hackathon_toolkit.rfq.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_toolkit"]
exclude = ["src/hackathon_toolkit/config.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
