<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Adira Bid Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: source documents on top, then the extracted facts on the left as an editable form and the live bid on the right, which recalculates on every keystroke. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --sunken: #e2e8ef;
  --ink: #12233b;
  --muted: #56667a;
  --line: #cbd5e0;
  --accent: #1f4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #dde6fb;
  --ok: #1d7a4f;
  --ok-soft: #d9efe3;
  --warn: #8a5200;
  --warn-soft: #fbecd0;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d141d; --surface: #151f2c; --sunken: #1c2938; --ink: #e3eaf2; --muted: #93a3b5; --line: #2a394b;
    --accent: #7ea2ff; --accent-ink: #0a1730; --accent-soft: #1c2c52; --ok: #5cc592; --ok-soft: #163526; --warn: #e9b458; --warn-soft: #3a2c10;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d141d; --surface: #151f2c; --sunken: #1c2938; --ink: #e3eaf2; --muted: #93a3b5; --line: #2a394b;
  --accent: #7ea2ff; --accent-ink: #0a1730; --accent-soft: #1c2c52; --ok: #5cc592; --ok-soft: #163526; --warn: #e9b458; --warn-soft: #3a2c10;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding: 0 clamp(16px, 3vw, 36px); padding-block: 0 56px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.05; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 22px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-size: .88em; }
.muted { color: var(--muted); font-size: 14.5px; }

.top { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; padding-block: 26px 16px; border-bottom: 2px solid var(--ink); }
.top h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 700; }
.top h1 span { color: var(--accent); }
.top p { color: var(--muted); max-width: 62ch; margin-top: 8px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.step { display: grid; gap: 12px; min-width: 0; }
.step-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.step-head h2 { font-size: 24px; font-weight: 600; }
.step-head h2 small { font: 700 15px/1 var(--display); color: var(--accent); margin-right: 8px; letter-spacing: .06em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 8px 16px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 4px 10px; font-size: 14px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.banner { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); border-radius: var(--r); padding: 8px 12px; font-size: 14.5px; }
.status { font-size: 14.5px; color: var(--muted); min-height: 1.5em; }

.fld { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld input, .fld select, .fld textarea { font: 14px/1.4 var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; width: 100%; min-width: 0; }
.fld textarea { resize: vertical; }
.fld.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.fld.check input { width: auto; accent-color: var(--accent); }
.srcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.srcs textarea { min-height: 150px; font-size: 13px; }

.main { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1020px) { .main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { font-size: 19px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.grid .wide { grid-column: 1 / -1; }
.grid .half { grid-column: span 2; }
@media (max-width: 420px) { .grid .half { grid-column: 1 / -1; } }
details.pos { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.pos > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.pos > summary::-webkit-details-marker { display: none; }
details.pos > summary::before { content: "▸"; color: var(--muted); }
details.pos[open] > summary::before { content: "▾"; }
details.pos > summary b { font: 600 19px/1 var(--display); }
details.pos > summary span { color: var(--muted); font-size: 14px; }
details.pos > summary .del { margin-left: auto; }
.pos-body { padding: 4px 14px 14px; display: grid; gap: 12px; }
.sub { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

.bid { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 12px; min-width: 0; }
@media (max-width: 1020px) { .bid { position: static; } }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-size: 14.5px; }
th { font: 600 11.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--sunken); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); }
td.num { font-family: var(--mono); font-size: 13.5px; }
tfoot td { border-bottom: 0; font-weight: 600; }
.facts-line { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
.facts-line b { color: var(--ink); font-weight: 600; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 14px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps .v { font: 500 14px/1.5 var(--mono); text-align: right; }
.steps .why { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.steps li.sum .v { background: var(--accent-soft); padding: 0 6px; border-radius: 3px; font-weight: 600; }
.steps li.sum span:first-child { font-weight: 600; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14.5px; }
.checks li { background: var(--warn-soft); border-radius: 3px; padding: 5px 9px; }
.allok { background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 5px 9px; font-size: 14.5px; font-weight: 500; }

/* Flow strip: the three steps as one line, each showing its live result */
.flow { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: stretch; }
.flow .arrow { align-self: center; font: 600 26px/1 var(--display); color: var(--muted); }
.flow-step { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 12px; align-items: center; min-width: 0; }
.flow-step .n { grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 20px/1 var(--display); background: var(--sunken); color: var(--ink); }
.flow-step b { font: 600 21px/1.1 var(--display); }
.flow-step small { font-size: 14.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-step[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.flow-step[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
.flow-step[aria-current="step"] small { color: var(--bg); opacity: .8; }
@media (max-width: 720px) { .flow { grid-template-columns: 1fr; } .flow .arrow { display: none; } }
.view { display: grid; gap: 14px; min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; justify-content: space-between; }
.view-head h2 { font-size: 28px; font-weight: 600; }
.view-head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 4px; }
.btn.big { padding: 12px 22px; font-size: 17px; }
.srcs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 720px) { .srcs { grid-template-columns: 1fr; } }
.src { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto 1fr; min-width: 0; overflow: hidden; }
.src-top { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 9px 12px; background: var(--sunken); }
.src-top b { font: 600 19px/1.1 var(--display); }
.src-top small { color: var(--muted); font-size: 14px; }
.src-top .cnt { margin-left: auto; font: 500 12px/1 var(--mono); color: var(--muted); }
.src textarea { border: 0; background: var(--surface); color: var(--ink); font: 13px/1.5 var(--mono); padding: 10px 12px; min-height: 190px; width: 100%; resize: vertical; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
details.pos { border-radius: 8px; }
details.pos > summary { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 14px; }
details.pos > summary::before { content: none; }
details.pos > summary .who { display: grid; gap: 2px; }
details.pos > summary .who b { font: 700 24px/1 var(--display); }
details.pos > summary .who span { font: 500 13px/1.2 var(--mono); color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 14px; background: var(--sunken); border-radius: 4px; padding: 3px 8px; white-space: nowrap; }
.tag b { font: 500 13.5px/1 var(--mono); }
.tag.warn { background: var(--warn-soft); }
.edit-hint { font-size: 14px; color: var(--accent); font-weight: 600; white-space: nowrap; }
details.pos[open] .edit-hint .o, details.pos:not([open]) .edit-hint .c { display: none; }
.bidgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 960px) { .bidgrid { grid-template-columns: 1fr; } }
.col { display: grid; gap: 14px; min-width: 0; }
.hero { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: end; justify-content: space-between; }
.hero .eyebrow { color: var(--bg); opacity: .75; }
.hero .big { font: 700 clamp(38px, 6vw, 56px)/1 var(--display); font-variant-numeric: tabular-nums; margin-top: 6px; }
.hero .facts-line { color: var(--bg); opacity: .9; }
.hero .facts-line b { color: var(--bg); }
.verdict { border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 16px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.warn { background: var(--warn-soft); color: var(--ink); }
.receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; }
.steps li { grid-template-columns: auto minmax(12px, 1fr) auto; align-items: baseline; border-bottom: 0; padding: 5px 0; }
.steps li .dots { border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.steps .why { grid-column: 1 / -1; }
.steps li.sum { border-top: 3px double var(--ink); margin-top: 6px; padding-top: 9px; }
.steps li.sum span:first-child { font: 600 20px/1 var(--display); }
.steps li.sum .v { font-size: 17px; }
.steps li.lead { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; }

/* Rule cards: each pricing rule as a small picture and one plain sentence */
.rules-head { font-size: 26px; font-weight: 600; margin-top: 8px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.rule h4 { font: 600 21px/1.1 var(--display); margin: 0; display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.rule h4 .amt { font: 500 14px/1 var(--mono); background: var(--accent-soft); padding: 4px 7px; border-radius: 4px; white-space: nowrap; }
.rule .say { font-size: 15.5px; line-height: 1.45; }
.ladder { display: flex; gap: 5px; align-items: flex-end; }
.rung { flex: 1; min-width: 0; background: var(--sunken); border-radius: 5px 5px 0 0; padding: 8px 6px; display: grid; gap: 3px; text-align: center; }
.rung small { font-size: 12.5px; color: var(--muted); }
.rung b { font: 500 12.5px/1.2 var(--mono); overflow-wrap: anywhere; }
.rung.on { background: var(--accent); color: var(--accent-ink); }
.rung.on small { color: var(--accent-ink); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain span { font: 500 13.5px/1 var(--mono); background: var(--sunken); padding: 7px 9px; border-radius: 5px; }
.chain span.op { background: none; padding: 0 1px; color: var(--muted); }
.chain span.res { background: var(--accent); color: var(--accent-ink); }
.meter { display: grid; gap: 5px; }
.meter .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.track { position: relative; height: 16px; background: var(--sunken); border-radius: 8px; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 8px; }
.track i.ok { background: var(--ok); }
.track u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
.timeline { display: flex; gap: 4px; }
.win { flex: 1; min-width: 0; background: var(--sunken); border-radius: 5px; padding: 7px 8px; display: grid; gap: 3px; }
.win small { font: 400 11.5px/1.3 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.win b { font: 500 13.5px/1 var(--mono); }
.win.on { background: var(--accent); color: var(--accent-ink); }
.win.on small { color: var(--accent-ink); }
.boxes { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.box { width: 38px; height: 34px; border: 2px solid var(--ink); border-radius: 4px; display: grid; place-items: center; font: 500 12.5px/1 var(--mono); background: var(--accent-soft); }
.box.part { background: var(--surface); border-style: dashed; }
.boxes .more { font-size: 14px; color: var(--muted); }
.split { display: flex; height: 30px; gap: 3px; }
.split div { min-width: 26px; background: var(--sunken); border-radius: 4px; display: grid; place-items: center; font: 500 12px/1 var(--mono); overflow: hidden; }
.split div.me { background: var(--accent); color: var(--accent-ink); }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1>Adira <span>Bid Desk</span></h1>
      <p data-i="lede"></p>
    </div>
    <div class="chips" role="group" aria-label="Language">
      <button class="chip" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
      <button class="chip" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <div class="banner" id="example-banner" data-i="example_banner"></div>

  <nav class="flow" aria-label="Steps">
    <button class="flow-step" data-view="src" type="button"><span class="n">1</span><b data-i="s1"></b><small id="fl-src"></small></button>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="flow-step" data-view="facts" type="button"><span class="n">2</span><b data-i="s2"></b><small id="fl-facts"></small></button>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="flow-step" data-view="bid" type="button"><span class="n">3</span><b data-i="s3"></b><small id="fl-bid"></small></button>
  </nav>

  <section class="view" id="view-src" aria-labelledby="h1s">
    <div class="view-head">
      <div><h2 id="h1s" data-i="v1"></h2><p data-i="s1_help"></p></div>
      <div class="row">
        <label class="fld" style="grid-template-columns:auto auto;align-items:center;gap:8px" for="scenario-date"><span data-i="date"></span><input id="scenario-date" type="date"></label>
        <button class="btn ghost small" id="load-example" data-i="load_example" type="button"></button>
        <button class="btn ghost small" id="clear-all" data-i="clear_all" type="button"></button>
      </div>
    </div>
    <div class="srcs">
      <div class="src"><div class="src-top"><b id="lt" data-i="src_tender_t"></b><small data-i="src_tender_h"></small><span class="cnt" id="cnt-tender"></span></div><textarea id="src-tender" aria-labelledby="lt" spellcheck="false"></textarea></div>
      <div class="src"><div class="src-top"><b id="ls" data-i="src_spec_t"></b><small data-i="src_spec_h"></small><span class="cnt" id="cnt-spec"></span></div><textarea id="src-spec" aria-labelledby="ls" spellcheck="false"></textarea></div>
      <div class="src"><div class="src-top"><b id="lm" data-i="src_mail_t"></b><small data-i="src_mail_h"></small><span class="cnt" id="cnt-mail"></span></div><textarea id="src-mail" aria-labelledby="lm" spellcheck="false"></textarea></div>
      <div class="src"><div class="src-top"><b id="le" data-i="src_erp_t"></b><small data-i="src_erp_h"></small><span class="cnt" id="cnt-erp"></span></div><textarea id="src-erp" aria-labelledby="le" spellcheck="false"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn big" id="extract" data-i="extract" type="button" disabled></button>
      <button class="btn ghost" id="stop" data-i="stop" type="button" hidden></button>
      <button class="btn ghost" data-go="facts" data-i="to_facts" type="button"></button>
      <span class="status" id="extract-status" aria-live="polite"></span>
    </div>
  </section>

  <section class="view" id="view-facts" aria-labelledby="h2s" hidden>
    <div class="view-head">
      <div><h2 id="h2s" data-i="v2"></h2><p data-i="s2_help"></p></div>
      <button class="btn ghost small" id="add-pos" data-i="add_pos" type="button"></button>
    </div>
    <div class="panel">
      <h3 data-i="order_level"></h3>
      <div class="grid" id="order-form"></div>
    </div>
    <div id="positions" class="view"></div>
    <div class="actions"><button class="btn big" data-go="bid" data-i="to_bid" type="button"></button></div>
  </section>

  <section class="view" id="view-bid" aria-labelledby="h3s" hidden>
    <div class="view-head">
      <div><h2 id="h3s" data-i="v3"></h2><p data-i="s3_help"></p></div>
      <div class="row">
        <button class="btn ghost small" id="copy-json" data-i="copy_json" type="button"></button>
        <button class="btn ghost small" id="save-json" data-i="save_json" type="button" hidden></button>
        <button class="btn ghost small" id="save-csv" data-i="save_csv" type="button" hidden></button>
        <span class="status" id="export-status" aria-live="polite"></span>
      </div>
    </div>
    <div class="bidgrid">
      <div class="col">
        <div class="hero">
          <div><div class="eyebrow" data-i="t_total"></div><div class="big" id="total"></div></div>
          <div class="facts-line" id="bid-facts"></div>
        </div>
        <div class="panel">
          <div class="tablewrap">
            <table>
              <thead><tr><th data-i="t_pos"></th><th data-i="t_mat"></th><th data-i="t_qty"></th><th data-i="t_unit"></th><th data-i="t_lead"></th><th data-i="t_line"></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script>
"use strict";
Decimal.set({ precision: 40, rounding: Decimal.ROUND_HALF_UP });
const Z = new Decimal(0), ONE = new Decimal(1);

/* ---------- pricing engine: exact decimals, each rule applied once ---------- */
function D(x) {
  if (x == null || typeof x === "boolean") return Z;
  if (Decimal.isDecimal(x)) return x;
  if (typeof x === "number") return Number.isFinite(x) ? new Decimal(String(x)) : Z;
  const m = String(x).trim().match(/-?\d[\d.,]*/);
  if (!m) return Z;
  let n = m[0].replace(/[.,]+$/, "");
  if (n.includes(",") && n.includes(".")) n = n.lastIndexOf(",") > n.lastIndexOf(".") ? n.replace(/\./g, "").replace(",", ".") : n.replace(/,/g, "");
  else if (n.includes(",")) n = n.replace(",", ".");
  try { return new Decimal(n); } catch (e) { return Z; }
}
const q2 = (x) => x.toDecimalPlaces(2, Decimal.ROUND_HALF_UP);
function parseNumber(text, fmt) {
  const m = String(text || "").match(/-?\d[\d.,]*/);
  let t = m ? m[0].replace(/[.,]+$/, "") : "";
  t = String(fmt || "de-DE").toLowerCase().startsWith("en") ? t.replace(/,/g, "") : t.replace(/\./g, "").replace(",", ".");
  try { return t && t !== "-" ? new Decimal(t) : Z; } catch (e) { return Z; }
}
function allocateCents(total, weights) {            // largest remainder, ties to the lower key
  const keys = Object.keys(weights), cents = q2(total).times(100), wsum = keys.reduce((a, k) => a.plus(weights[k]), Z), out = {};
  if (cents.isZero() || wsum.isZero()) { keys.forEach((k) => out[k] = Z); return out; }
  const raw = {}, base = {}; let used = Z;
  keys.forEach((k) => { raw[k] = cents.times(weights[k]).div(wsum); base[k] = raw[k].floor(); used = used.plus(base[k]); });
  const left = cents.minus(used).toNumber();
  const order = [...keys].sort((a, b) => { const c = raw[b].minus(base[b]).cmp(raw[a].minus(base[a])); return c || (a < b ? -1 : a > b ? 1 : 0); });
  order.slice(0, left).forEach((k) => base[k] = base[k].plus(1));
  keys.forEach((k) => out[k] = base[k].div(100));
  return out;
}
function marginalBands(amount, bands) {
  let total = Z;
  for (const b of bands) {
    const lo = D(b.from), top = b.to === "" || b.to == null ? amount : Decimal.min(amount, D(b.to));
    if (top.gt(lo)) total = total.plus(top.minus(lo).times(D(b.percent)).div(100));
  }
  return q2(total);
}
const lines = (text, n) => String(text || "").split("\n").map((l) => l.split(";").map((c) => c.trim())).filter((c) => c.some(Boolean) && c.length >= n);

function compute(f, date) {
  const rows = [], skipped = [];
  for (const p of f.positions) {
    const qty = D(p.quantity_pieces).floor().toNumber();
    if (!(qty > 0)) { skipped.push(p.position); continue; }
    const cur = String(p.currency || "EUR").trim().toUpperCase() || "EUR";
    let unit = D(p.price_unit_pieces); if (unit.lte(0)) unit = ONE;
    let fx = D(p.eur_per_currency_unit); if (fx.lte(0)) fx = ONE;
    if (cur === "EUR") fx = ONE;                                             // a EUR condition is never converted
    const scales = lines(p.scalesText, 2).map(([a, b]) => ({ min: D(a), price: parseNumber(b, p.number_format), text: b })).filter((s) => !s.price.isZero());
    const ok = scales.filter((s) => s.min.lte(qty)).sort((a, b) => b.min.cmp(a.min));
    const scale = ok[0] || null;                                             // highest scale not above the position's own quantity
    const base = scale ? q2(scale.price.div(unit).times(fx)) : Z;
    const rates = lines(p.ratesText, 3).map(([a, b, c]) => ({ from: a || "0000", to: b || "9999", rate: D(c) }));
    const rate = rates.find((r) => r.from.slice(0, 10) <= date && date <= r.to.slice(0, 10)) || null;
    const mass = D(p.surcharge_mass_kg), massSur = mass.times(rate ? rate.rate : Z);
    rows.push({ p, pos: String(p.position), qty, cur, unit, fx, scale, scales, base, rate, rates, mass, massSur, mat: String(p.material || "").trim() });
  }
  const undiscounted = q2(rows.reduce((a, r) => a.plus(r.base.times(r.qty)), Z));
  let pct = D(f.discount_percent);
  const hasThreshold = String(f.discount_min || "").trim() !== "", threshold = D(f.discount_min);
  const discountBlocked = hasThreshold && undiscounted.lt(threshold);
  if (discountBlocked) pct = Z;
  const members = {}; rows.filter((r) => r.p.pool_member).forEach((r) => members[r.pos] = new Decimal(r.qty).times(D(r.p.allocation_mass)));
  const poolAlloc = Object.keys(members).length ? allocateCents(D(f.pool_fee), members) : {};
  const goods = {}; rows.filter((r) => r.p.bonus_member).forEach((r) => goods[r.pos] = r.base.times(r.qty));
  const bands = lines(f.bandsText, 3).map(([a, b, c]) => ({ from: a, to: b, percent: c }));
  const goodsSum = Object.values(goods).reduce((a, v) => a.plus(v), Z);
  const bonusTotal = Object.keys(goods).length ? marginalBands(goodsSum, bands) : Z;
  const bonusAlloc = Object.keys(goods).length ? allocateCents(bonusTotal, goods) : {};
  const demand = {}; rows.forEach((r) => demand[r.mat] = (demand[r.mat] || 0) + r.qty);
  let total = Z; const out = [];
  for (const r of rows) {
    const p = r.p, clause = String(p.discount_clause || "base"), fct = ONE.minus(pct.div(100));
    const baseD = clause === "none" ? r.base : r.base.times(fct);
    const surD = clause === "base_and_surcharge" ? r.massSur.times(fct) : r.massSur;
    const poolShare = poolAlloc[r.pos] || Z, setup = D(p.setup_fee_eur).plus(poolShare);
    let csize = D(p.carton_size).floor().toNumber(); if (!(csize > 0)) csize = 1;
    const cartons = Math.ceil(r.qty / csize), cartonCost = D(p.carton_tariff_eur).times(cartons);
    const bonus = bonusAlloc[r.pos] || Z;
    const unitPrice = q2(baseD.plus(surD).plus(setup.plus(cartonCost).minus(bonus).div(r.qty)));   // rounded once
    const comMat = String(p.com_material || "").trim(), ceiling = D(p.com_ceiling).toNumber();
    let lead, why;
    if (comMat && comMat === r.mat && demand[r.mat] <= ceiling) { lead = D(p.com_weeks); why = "commit"; }
    else if (D(p.free_stock).gte(demand[r.mat])) { lead = D(p.lead_stock_weeks); why = "stock"; }
    else { lead = D(p.lead_production_weeks); why = "prod"; }
    const line = unitPrice.times(r.qty); total = total.plus(line);
    out.push({ ...r, clause, baseD, surD, poolShare, setup, csize, cartons, cartonCost, bonus, unitPrice, lead: Math.max(0, lead.floor().toNumber()), why, demand: demand[r.mat], line });
  }
  return { rows: out, skipped, undiscounted, pct, discountBlocked, threshold, hasThreshold, bonusTotal, goodsSum, total: q2(total) };
}

/* ---------- export ---------- */
function answer() {
  return { tender_reference: state.facts.tender_reference, decision: "bid", currency: "EUR", discount_percent: result.pct.toNumber(),
    positions: result.rows.map((r) => ({ position: r.pos, material_number: r.mat, quantity: r.qty, unit_price: r.unitPrice.toNumber(), lead_time_weeks: r.lead,
      base_unit_price: r.base.toNumber(), surcharge_per_unit: q2(r.massSur.plus(r.setup.div(r.qty))).toNumber(), packaging_per_unit: q2(r.cartonCost.div(r.qty)).toNumber(), rebate_total: r.bonus.toNumber() })),
    total_net: result.total.toNumber() };
}
function csv() {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ["position", "material", "quantity", "unit_price_eur", "lead_time_weeks", "line_total_eur"];
  const body = result.rows.map((r) => [r.pos, r.mat, r.qty, r.unitPrice.toFixed(2), r.lead, r.line.toFixed(2)]);
  return [head, ...body, ["", "", "", "", "total_net_eur", result.total.toFixed(2)]].map((l) => l.map(q).join(",")).join("\n");
}
const flash = (k) => { $("#export-status").textContent = L(k); };

const fileBase = () => "bid-" + (state.facts.tender_reference || "draft").replace(/[^A-Za-z0-9_-]+/g, "-");

/* ---------- extraction with Claude ---------- */
const PROMPT = `You prepare the facts for an industrial bid calculation. Read the four sources and return ONE JSON object, nothing else.

How to choose values:
- Quantities: start from the bill of quantities. Apply bidder Q&A changes in date order; a withdrawn answer no longer counts, so fall back to the latest change that is still valid. Convert sets to pieces with the specification's pieces per set.
- Material: the released (not blocked) material of the requirement's catalogue group that matches the requirement.
- Mails: for each topic use the latest mail dated on or before the scenario date whose subject carries EXACTLY the tender reference. A reference with a suffix (for example ending in -A) is another tender: ignore it.
- Copy every price scale exactly as displayed into price_text. Do not convert, round or reformat numbers. State the number format of the price condition.
- Metal index: list every rate window given for the material's index key.
- If a value is not in the sources, use an empty string. Never guess.

JSON shape (all values as strings unless shown as true/false):
{"tender_reference":"","discount_percent":"","discount_min_undiscounted_net_eur":"","pool_fee_eur":"",
 "bonus_bands":[{"from_eur":"","to_eur":"","percent":""}],
 "positions":[{"position":"","material":"","quantity_pieces":"","currency":"EUR","eur_per_currency_unit":"1","price_unit_pieces":"1","number_format":"de-DE or en-US",
  "scales":[{"min_qty":"","price_text":""}],"surcharge_mass_kg":"","metal_rates":[{"valid_from":"YYYY-MM-DD","valid_to":"YYYY-MM-DD","rate_eur_per_kg":""}],
  "discount_clause":"base | base_and_surcharge | none","setup_fee_eur":"","pool_member":false,"allocation_mass":"","carton_size":"","carton_tariff_eur":"","bonus_member":false,
  "free_stock":"","lead_stock_weeks":"","lead_production_weeks":"","commitment_material":"","commitment_ceiling_pieces":"","commitment_weeks":""}]}`;
const s = (v) => (v == null ? "" : String(v));
function applyFacts(j) {
  if (!j || typeof j !== "object" || !Array.isArray(j.positions) || !j.positions.length) throw { code: "invalid_json" };
  const clause = (c) => (["base", "base_and_surcharge", "none"].includes(s(c).trim()) ? s(c).trim() : "base");
  state.facts = {
    tender_reference: s(j.tender_reference), discount_percent: s(j.discount_percent), discount_min: s(j.discount_min_undiscounted_net_eur), pool_fee: s(j.pool_fee_eur),
    bandsText: (Array.isArray(j.bonus_bands) ? j.bonus_bands : []).map((b) => [s(b.from_eur), s(b.to_eur), s(b.percent)].join(" ; ")).join("\n"),
    positions: j.positions.slice(0, 40).map((p) => ({ ...blankPos(""),
      position: s(p.position), material: s(p.material), quantity_pieces: s(p.quantity_pieces), currency: s(p.currency) || "EUR", eur_per_currency_unit: s(p.eur_per_currency_unit) || "1",
      price_unit_pieces: s(p.price_unit_pieces) || "1", number_format: s(p.number_format).toLowerCase().startsWith("en") ? "en-US" : "de-DE",
      scalesText: (Array.isArray(p.scales) ? p.scales : []).map((x) => s(x.min_qty) + " ; " + s(x.price_text)).join("\n"),
      surcharge_mass_kg: s(p.surcharge_mass_kg), ratesText: (Array.isArray(p.metal_rates) ? p.metal_rates : []).map((x) => [s(x.valid_from), s(x.valid_to), s(x.rate_eur_per_kg)].join(" ; ")).join("\n"),
      discount_clause: clause(p.discount_clause), setup_fee_eur: s(p.setup_fee_eur), pool_member: p.pool_member === true, allocation_mass: s(p.allocation_mass),
      carton_size: s(p.carton_size) || "1", carton_tariff_eur: s(p.carton_tariff_eur), bonus_member: p.bonus_member === true,
      free_stock: s(p.free_stock), lead_stock_weeks: s(p.lead_stock_weeks), lead_production_weeks: s(p.lead_production_weeks),
      com_material: s(p.commitment_material), com_ceiling: s(p.commitment_ceiling_pieces), com_weeks: s(p.commitment_weeks) })),
  };
}
function renderExtract() {
  const b = $("#extract"), running = !!ctl;
  b.disabled = running || sampleState !== "ready"; b.hidden = sampleState === "none";
  $("#stop").hidden = !running;
  $("#extract-status").textContent = L(xmsg);
}
$("#extract").addEventListener("click", async () => {
  if (!sampleFn || ctl) return;
  const src = state.src;
  if (!(src.tender + src.spec + src.mail + src.erp).trim()) { xmsg = "x_empty"; renderExtract(); return; }
  ctl = new AbortController(); xmsg = "x_run"; renderExtract();
  const input = PROMPT + "\n\nScenario date: " + (state.date || "unknown") + "\n\n# TENDER PORTAL\n" + src.tender.slice(0, 50000) + "\n\n# SPECIFICATION\n" + src.spec.slice(0, 40000) + "\n\n# MAILBOX\n" + src.mail.slice(0, 50000) + "\n\n# ERP\n" + src.erp.slice(0, 50000);
  try {
    const j = await sampleFn.json(input, { signal: ctl.signal });
    applyFacts(j); state.example = false; state.view = "facts"; sel = 0; save(); xmsg = "x_done";
    document.querySelectorAll("details.pos").forEach((d) => d.remove());
    renderForms(); recompute(); renderBanner();
  } catch (e) {
    const c = e && e.code;
    xmsg = c === "cancelled" ? "x_stopped" : c === "invalid_json" ? "x_json" : c === "rate_limited" ? "x_rate" : c === "prompt_too_large" ? "x_big" : "x_err";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { xmsg = "x_not_granted"; sampleState = "none"; }
  } finally { ctl = null; renderExtract(); }
});
$("#stop").addEventListener("click", () => { if (ctl) ctl.abort(); });

renderAll();

(async () => {
  const c = window.claude;
  if (!c || !c.use) { sampleState = "none"; xmsg = "x_none"; renderExtract(); return; }
  c.use("downloads").then((d) => { downloads = d; $("#save-json").hidden = !d; $("#save-csv").hidden = !d; }).catch(() => {});
  try { sampleFn = await c.use("sample"); } catch (e) { sampleFn = null; }
  sampleState = sampleFn ? "ready" : "none"; if (xmsg === "x_wait") xmsg = sampleFn ? "x_ready" : "x_none";
  renderExtract();
